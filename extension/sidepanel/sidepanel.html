<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Personal Context — Project Handoff</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 14px; }
    #handoff { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 6px; max-height: 60vh; overflow-y: auto; font-size: 12px; }
