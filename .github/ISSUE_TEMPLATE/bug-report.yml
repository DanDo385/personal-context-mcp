name: Bug report
description: Something works differently from what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Never paste secrets.** Remove keys, passwords and connection strings from anything you share."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `uv run personal-context-mcp --version` or `git rev-parse --short HEAD`."
  - type: dropdown
    id: where
    attributes:
      label: Where is it running?
      options: ["Vercel", "Docker / Cloud Run / other host", "Locally", "Not sure"]
